<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">✈️ TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <div class="page-container">
    <h1>CONTACT US</h1>
    <p>Have questions or need custom travel advice? Send us a message!</p>
    
    <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.'); this.reset();">
      <label for="name">Name</label>
      <input type="text" id="name" required placeholder="Your full name">

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="yourname@example.com">

      <label for="message">Message</label>
      <textarea id="message" rows="5" required placeholder="Write your message here..."></textarea>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
